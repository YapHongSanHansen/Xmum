<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1000" viewBox="0 0 540 1000">
  <!-- SYNTHETIC DEMO SLIP. "Bank Cempaka" is a fictional bank. Not a real receipt. -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3e8f"/>
      <stop offset="1" stop-color="#7a4fa8"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .lbl { font-size: 15px; fill: #6b6478; }
    .val { font-size: 16px; fill: #1f1a2b; font-weight: 600; }
    .small { font-size: 13px; fill: #6b6478; }
  </style>

  <rect width="540" height="1000" fill="#f4f1f8"/>

  <!-- status bar -->
  <rect width="540" height="44" fill="#4a3277"/>
  <text x="24" y="29" font-size="16" font-weight="600" fill="#ffffff">14:25</text>
  <rect x="470" y="17" width="40" height="15" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="473" y="20" width="28" height="9" rx="1.5" fill="#ffffff"/>
  <rect x="511" y="21" width="3" height="7" rx="1" fill="#ffffff"/>
  <circle cx="440" cy="25" r="3" fill="#ffffff"/><circle cx="450" cy="25" r="3" fill="#ffffff"/><circle cx="430" cy="25" r="3" fill="#ffffff"/>

  <!-- app header -->
  <rect y="44" width="540" height="96" fill="url(#hdr)"/>
  <!-- cempaka flower mark: five soft petals -->
  <g transform="translate(52,92)">
    <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#f7e7b4"/>
    <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#f7e7b4" transform="rotate(72)"/>
    <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#f7e7b4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#f7e7b4" transform="rotate(216)"/>
    <ellipse cx="0" cy="-14" rx="7" ry="14" fill="#f7e7b4" transform="rotate(288)"/>
    <circle r="5" fill="#d9a441"/>
  </g>
  <text x="86" y="88" font-size="24" font-weight="700" fill="#ffffff">Bank Cempaka</text>
  <text x="86" y="112" font-size="14" fill="#e6dcf3">Cempaka Go · fictional demo bank</text>

  <!-- receipt card -->
  <rect x="20" y="164" width="500" height="700" rx="18" fill="#ffffff" stroke="#e3dcec"/>

  <circle cx="270" cy="232" r="36" fill="#e5f4ea"/>
  <path d="M252 233 l12 12 l24 -26" fill="none" stroke="#2f8a57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#1f1a2b">Transfer successful</text>
  <text x="270" y="328" text-anchor="middle" class="small">DuitNow Transfer</text>

  <text x="270" y="384" text-anchor="middle" font-size="18" fill="#6b6478">Amount</text>
  <text x="270" y="430" text-anchor="middle" font-size="44" font-weight="700" fill="#4a3277">RM 2,770.00</text>

  <line x1="44" y1="462" x2="496" y2="462" stroke="#ece6f2" stroke-dasharray="6 6"/>

  <text x="44" y="498" class="lbl">Date &amp; time</text>
  <text x="496" y="498" text-anchor="end" class="val">23 Oct 2026, 14:25</text>

  <text x="44" y="542" class="lbl">From</text>
  <text x="496" y="542" text-anchor="end" class="val">MEGA BINA HARDWARE</text>
  <text x="496" y="562" text-anchor="end" class="val">TRADING SDN BHD</text>
  <text x="496" y="582" text-anchor="end" class="small">Current account •••• 4417</text>

  <text x="44" y="626" class="lbl">To</text>
  <text x="496" y="626" text-anchor="end" class="val">LORI LAJU LOGISTICS</text>
  <text x="496" y="646" text-anchor="end" class="val">SDN BHD</text>
  <text x="496" y="666" text-anchor="end" class="small">Account •••• 0926</text>

  <text x="44" y="710" class="lbl">Recipient reference</text>
  <text x="496" y="710" text-anchor="end" class="val">INV2304</text>

  <text x="44" y="752" class="lbl">Reference no.</text>
  <text x="496" y="752" text-anchor="end" class="val">BCX-261023-0831742</text>

  <text x="44" y="794" class="lbl">Status</text>
  <text x="496" y="794" text-anchor="end" font-size="16" font-weight="700" fill="#2f8a57">Successful</text>

  <line x1="44" y1="822" x2="496" y2="822" stroke="#ece6f2"/>
  <text x="270" y="848" text-anchor="middle" class="small">Keep this screenshot as your record.</text>

  <!-- diagonal watermark -->
  <g transform="translate(270,560) rotate(-32)" opacity="0.16">
    <text x="0" y="-18" text-anchor="middle" font-size="40" font-weight="800" fill="#b4232c">SYNTHETIC DEMO</text>
    <text x="0" y="30" text-anchor="middle" font-size="34" font-weight="800" fill="#b4232c">NOT A REAL RECEIPT</text>
  </g>

  <!-- buttons -->
  <rect x="20" y="884" width="240" height="48" rx="24" fill="#ffffff" stroke="#7a4fa8" stroke-width="1.5"/>
  <text x="140" y="914" text-anchor="middle" font-size="16" font-weight="600" fill="#5b3e8f">Share</text>
  <rect x="280" y="884" width="240" height="48" rx="24" fill="#5b3e8f"/>
  <text x="400" y="914" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Done</text>

  <!-- footer -->
  <rect y="950" width="540" height="50" fill="#b4232c"/>
  <text x="270" y="981" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">SYNTHETIC DEMO · NOT A REAL RECEIPT</text>
</svg>
